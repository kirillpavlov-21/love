name: Место или событие для каталога
description: Вставь пост из Instagram, ссылку или свою подсказку — ежедневный конвейер разберёт её и предложит в Pull Request.
title: "Источник: "
labels: ["источник"]
body:
  - type: markdown
    attributes:
      value: |
        Конвейер берёт задачи только от владельца и соавторов репозитория. Тексты на сайт не копируются: описание пишется заново, фото берутся только со свободной лицензией.
  - type: textarea
    id: text
    attributes:
      label: Текст поста или подсказка
      description: Название места, адрес, что там интересного, даты события — всё, что есть. Можно просто вставить подпись к посту.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Ссылка (необязательно)
      description: Пост, сайт места или страница события.
